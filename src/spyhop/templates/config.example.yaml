# Spyhop configuration. Copy to ~/.config/spyhop/config.yaml (`spyhop config init`)
# and adapt the machine-specific values: repository paths, projects and the names
# of the environment variables holding the JIRA credentials.
#
# Any value can be overridden with SPYHOP_<SECTION>__<KEY>, for example
# SPYHOP_APPLICATION__DRY_RUN=false. Paths accept ~ and ${VAR}.

application:
  polling_interval: 45            # seconds
  max_concurrent_agents: 1
  min_free_disk_gb: 20            # no new worktrees below this free space; 0 disables
  dry_run: true                   # only log what would be done
  # timezone: Europe/Madrid       # defaults to the system time zone

jira:
  base_url: https://your-site.atlassian.net
  user_env: JIRA_API_USER         # names of the variables, never their values
  token_env: JIRA_API_TOKEN
  request_timeout: 20
  transition_margin_minutes: 5
  acceptance_criteria_fields: []  # custom fields copied to TASK.md, e.g. [customfield_10048]
  max_comments: 20                # latest comments copied to TASK.md

repositories:                     # alias -> path on this machine
  main:
    path: ~/git/your-repository
    default_base_branch: master
    setup: inherit                # Orca setup hooks for new worktrees: inherit | run | skip
    build_commands: []            # allowed to the agent, e.g. ["./gradlew", "ant"]

projects:
  PROJ:
    enabled: true
    workflows:                    # keyed by JIRA issue type
      Bug:
        name: bug_fix
        trigger_statuses: ["In Progress"]
        repository: main
        prompt: bug_fix.md        # workflow guidance added to TASK.md
        plan_review: true
      Story:
        name: feature
        trigger_statuses: ["In Development"]
        repository: main
        prompt: feature.md
        plan_review: true
      Task:
        name: technical_task
        trigger_statuses: ["In Progress"]
        repository: main
        prompt: technical_task.md
        plan_review: false

orca:
  # executable: ~/.local/bin/orca-ide   # autodetected when omitted
  startup_timeout: 30
  operation_timeout: 120
  # Board column the agent moves its card to when the plan is ready. To keep
  # plans apart from pull requests, add a "Plan review" column to the Orca
  # board and put its id here: Orca names custom columns status-N, and the id
  # is in workspaceStatuses of the "ui" document in
  # ~/.config/orca/profiles/<profile>/profile-state.db.
  plan_review_status: in-review
  # Column that approves a plan: dragging the card there makes Spyhop send the
  # agent the implementation /goal.
  plan_approved_status: in-progress

agents:
  provider: claude
  model: sonnet
  effort: high
  max_retries: 0

cleanup:                          # remove worktrees of closed tickets (never forced)
  enabled: true
  close_status_categories: ["done"] # JIRA status category keys
  close_statuses: []                # extra closed statuses outside those categories

service:
  env_source: env_file            # env_file | login_shell
  env_file: ~/.config/spyhop/env
