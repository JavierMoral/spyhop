# Spyhop configuration. Copy to ~/.config/spyhop/config.yaml (`spyhop config init`)
# and adapt the machine-specific values: repository paths, projects and the names
# of the environment variables holding the JIRA credentials.
#
# Any value can be overridden with SPYHOP_<SECTION>__<KEY>, for example
# SPYHOP_APPLICATION__DRY_RUN=false. Paths accept ~ and ${VAR}.

application:
  polling_interval: 45            # seconds
  max_concurrent_agents: 1
  min_free_disk_gb: 20            # no new worktrees below this free space; 0 disables
  dry_run: true                   # only log what would be done
  # team: "@liferay-page-management"  # your team in .github/CODEOWNERS (ownership checkpoint)

jira:
  base_url: https://your-site.atlassian.net
  user_env: JIRA_API_USER         # names of the variables, never their values
  token_env: JIRA_API_TOKEN
  request_timeout: 20
  transition_margin_minutes: 5

repositories:                     # alias -> path on this machine
  main:
    path: ~/git/your-repository
    default_base_branch: master
    setup: inherit                # Orca setup hooks for new worktrees: inherit | run | skip
    build_commands: []            # allowed to the agent, e.g. ["./gradlew", "ant"]
    # worktree_script: ~/bin/spyhop-create-worktree  # creates worktrees instead of Orca (see README)
    # worktree_script_timeout: 600  # seconds the script may take
    # worktree_cleanup_script: ~/bin/spyhop-remove-worktree  # runs after Orca removes a worktree
    # worktree_cleanup_script_timeout: 600

projects:
  PROJ:
    enabled: true
    workflows:                    # keyed by JIRA issue type
      Bug:
        name: bug_fix
        trigger_statuses: ["In Progress"]
        repository: main
        prompt: bug_fix.md        # template with the guidance added to CLAUDE-TASK.md, looked
                                  # up first in ~/.config/spyhop/templates/, then among
                                  # the bundled ones; copy one there to customize it
                                  # (`spyhop doctor` lists the directory)
        pipeline: bug             # instead of plan_review: the phases in
                                  # pipelines below; see the README
      Story:
        name: feature
        trigger_statuses: ["In Development"]
        repository: main
        prompt: feature.md
        plan_review: true
      Task:
        name: technical_task
        trigger_statuses: ["In Progress"]
        repository: main
        prompt: technical_task.md
        pipeline: technical_task

pipelines:                        # checkpoints are subagents in
  bug:                            # ~/.claude/agents/checkpoint-<name>.md;
                                  # `spyhop claude install` links them there
    - checks: [ticket-info, repro-steps, reproduce]
      on_fail: human              # the run waits for you
    - plan
    - plan_review
    - checks: [ownership]            # the fix is in a component of your team
      on_fail: human
    - implement
    # - code_review: /code-review-loop --rounds 2  # reviews the commits
    - checks: [format, regressions, verify-fix, mutation, variants, security]
      on_fail: fix                # the agent fixes the findings
      rounds: 3
  technical_task:
    - implement
    - checks: [format, regressions, security]
      on_fail: fix
      rounds: 3

orca:
  # executable: ~/.local/bin/orca-ide   # autodetected when omitted
  startup_timeout: 30
  operation_timeout: 120
  # Both values are ids of Orca board columns, not JIRA statuses. Keep Orca's
  # built-in columns (todo, in-progress, in-review, completed): they have the
  # same id everywhere, while Orca gives a custom column a different status-N on
  # each machine.
  #
  # Board column the agent moves its card to when the plan is ready.
  plan_review_status: in-review
  # Column that approves a plan: dragging the card there makes Spyhop send the
  # agent the implementation /goal. Finished work stays in this column too;
  # Spyhop tells them apart by CLAUDE-RESULT.md.
  plan_approved_status: in-progress

agents:
  provider: claude
  plan_model: opus                # writes CLAUDE-PLAN.md when plan_review is true
  model: sonnet                   # implements; a new agent after the plan is approved
  effort: high
  max_restarts: 1                 # one more turn after a turn without a valid end, then wait
  # review_command: /code-review-loop --rounds 2  # a code_review phase after implement
  # implement_timeout_minutes: 360   # a turn without a result stops, and the agent continues
  # code_review_timeout_minutes: 120
  # progress_minutes: 15          # the progress of a long turn goes to the supervisor session; 0: never

knowledge:                        # findings of earlier tickets
  # recall_command: /recall       # the agent searches with keywords of the ticket before it plans
  # write_script: ~/bin/spyhop-write-finding  # stores fixed findings
  write_timeout: 60

pull_requests:                    # watches your pull requests after a run completes; it only reads
  enabled: false                  # needs gh, signed in (`gh auth login`)
  polling_interval: 300           # seconds; at least 60
  bot_logins: [liferay-continuous-integration]
  forward_branch: "ci-forward-{branch}-pr-{number}-sender-{login}"  # empty: no forwarded pull requests
  merged_comment: "Merged. Thank you."  # a comment that starts with this text confirms the merge

cleanup:                          # remove worktrees of closed tickets (never forced)
  enabled: true
  close_status_categories: ["done"] # JIRA status category keys
  close_statuses: []                # extra closed statuses outside those categories

service:
  env_source: env_file            # env_file | login_shell
  env_file: ~/.config/spyhop/env
