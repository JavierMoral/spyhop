[project]
name = "spyhop"
version = "0.1.0"
description = "Watches JIRA and feeds tickets to Claude Code agents running in Orca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "platformdirs>=4.14.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
spyhop = "spyhop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spyhop"]
mypy_path = "src"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
